[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-benchmark"
version = "0.1.0"
description = "Explainable and robust EEG motor-imagery classification benchmark (CSP+LogReg vs compact EEGNet)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adel Farfar" }]
keywords = ["EEG", "BCI", "motor-imagery", "CSP", "EEGNet", "robustness", "explainability"]

dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "mne>=1.6",
    "torch>=2.2",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
explain = ["captum>=0.7"]

[project.scripts]
eeg-benchmark = "eeg_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    # Spurious floating-point warnings from NumPy 2.1.x matmul on Apple Accelerate BLAS.
    # Verified harmless: plain well-conditioned float32 A@B triggers it; results are correct.
    # Does not occur on CI (Linux/OpenBLAS). See README "Limitations".
    "ignore:.*encountered in matmul:RuntimeWarning",
]
